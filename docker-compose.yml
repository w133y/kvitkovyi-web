# Self-hosted stack on the VPS: the site, its Postgres and an S3-compatible
# store for uploads (RustFS — MinIO's API, since MinIO stopped publishing
# images). Secrets come from .env next to this file (not in git): the app's
# own vars, plus POSTGRES_PASSWORD and STORAGE_ACCESS_KEY/STORAGE_SECRET_KEY.
# Only localhost ports are published — cloudflared exposes the site and the
# store's public hostname (deploy/README.md).

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kvitkovyi:${POSTGRES_PASSWORD}@db:5432/kvitkovyi
      DIRECT_URL: postgresql://kvitkovyi:${POSTGRES_PASSWORD}@db:5432/kvitkovyi
      SITE_URL: https://kvitkovyi.pp.ua
      AUTH_URL: https://kvitkovyi.pp.ua
      # Behind cloudflared: trust the forwarded host/proto for auth callbacks.
      AUTH_TRUST_HOST: "true"
      # Uploads (lib/r2.ts): browser-facing URLs on the public hostname, the
      # server's own reads/writes straight to the container.
      R2_ENDPOINT: https://storage.kvitkovyi.pp.ua
      R2_INTERNAL_ENDPOINT: http://storage:9000
      R2_PUBLIC_URL: https://storage.kvitkovyi.pp.ua/kvitkovyi
      R2_BUCKET_NAME: kvitkovyi
      R2_REGION: us-east-1
      R2_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      R2_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kvitkovyi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kvitkovyi
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvitkovyi -d kvitkovyi"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
    volumes:
      - storage:/data
    ports:
      - "127.0.0.1:9000:9000"

volumes:
  pgdata:
  storage:
